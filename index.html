<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Dulu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
    
    <header>
        <h1>Baca Dulu</h1>
        <p>Pahami dokumen kamu dalam bahasa sehari-hari</p>
    </header>

    <main>

        <section id= "upload-area">
            <h2>Upload Dokumen</h2>
            <input type="file" id="file-input" accept="image/*,.pdf" />
            <button id="analyze-btn">Analisis Dokumen</button>
            <p id="file-name">Belum ada file dipilih</p>
        </section>
        
        <section id="result-area">
            <h2>Hasil Analisis</h2>
        </section>

        <p id="disclaimer">
            ⚠️ Hasil analisis ini hanya untuk membantu pemahaman, bukan nasihat hukum resmi. Konsultasikan dengan ahli hukum untuk keputusan penting.
        </p>

    </main>

    <script src="app.js"></script>
</body>
</html>
